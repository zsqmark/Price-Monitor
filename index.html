    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (window.fetch) {
              Object.defineProperty(window, 'fetch', {
                value: window.fetch.bind(window),
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
